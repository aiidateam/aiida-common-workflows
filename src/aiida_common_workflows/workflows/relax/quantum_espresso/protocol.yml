verification-PBE-v1:
  description: Main protocol for the ACWF verification study - SSSP version
  base:
    pseudo_family: &pseudo_family SSSP/1.2/PBE/precision
    kpoints_distance: &kpoints_distance 0.06
    meta_parameters:
      conv_thr_per_atom: &conv_thr_per_atom 0.1e-9
      etot_conv_thr_per_atom: 0.5e-5
    pw:
      parameters:
        CONTROL:
          forc_conv_thr: 0.5e-4
        SYSTEM:
          smearing: &smearing fd
          degauss: &degauss 0.0045
  base_final_scf:
    pseudo_family: *pseudo_family
    kpoints_distance: *kpoints_distance
    meta_parameters:
      conv_thr_per_atom: *conv_thr_per_atom
    pw:
      parameters:
        SYSTEM:
          smearing: *smearing
          degauss: *degauss
moderate:
  description: "Protocol to perform the computation at normal precision at moderate computational cost."
precise:
  description: "Protocol to perform the computation at high precision at higher computational cost."
  kpoints_distance: 0.10
  meta_parameters:
    conv_thr_per_atom: 0.1e-9
    etot_conv_thr_per_atom: 0.5e-5
  pseudo_family: "SSSP/1.3/PBEsol/precision"
  pw:
    parameters:
      CONTROL:
        forc_conv_thr: 0.5e-4
      SYSTEM:
        degauss: 0.0125
fast:
  description: "Protocol to perform the computation at low precision at minimal computational cost for testing purposes."
  kpoints_distance: 0.30
  meta_parameters:
    conv_thr_per_atom: 0.4e-9
    etot_conv_thr_per_atom: 1.e-4
  pw:
    parameters:
      CONTROL:
        forc_conv_thr: 1.e-3
      SYSTEM:
        degauss: 0.0275
